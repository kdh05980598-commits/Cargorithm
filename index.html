        .main-logo { font-size: 36px; font-weight: 900; color: var(--primary); letter-spacing: -1.5px; margin-bottom: 10px; text-shadow: 1px 1px 3px rgba(255,255,255,0.8); }
        .top-contact { font-size: 14px; color: #111; font-weight: 700; text-align: center; background: rgba(255,255,255,0.7); padding: 2px 8px; border-radius: 4px; }

        .main-tab { flex: 1; padding: 15px; text-align: center; color: #fff; cursor: pointer; font-weight: 700; font-size: 15px; border-bottom: 4px solid transparent; min-width: 120px; }
        .main-tab.active { background: var(--accent); border-bottom: 4px solid #fff; }

        .sub-nav-container { background: var(--white); border-bottom: 1px solid #ddd; padding: 15px 0; }
        .sub-nav { display: none; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .sub-nav.active { display: flex; }
        .sub-tab { padding: 8px 25px; border-radius: 25px; font-size: 14px; cursor: pointer; border: 1px solid #ddd; font-weight: 600; transition: 0.2s; }
        .sub-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .mid-bg-wrapper { background-size: cover; background-position: center; background-attachment: fixed; min-height: 500px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; min-height: 400px; background: rgba(244, 247, 249, 0.9); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 슬라이더 스타일 */
        .slider-wrapper { width: 100%; overflow: hidden; border-radius: 15px; margin-bottom: 30px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #fff; }
        .slider-track { display: flex; transition: transform 0.5s ease-in-out; }
        .slide { min-width: 100%; box-sizing: border-box; text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #0a192f, #1164ff); color: #fff; }
        .slide h2 { margin: 0 0 10px 0; font-size: 28px; }
        .slide p { margin: 0; font-size: 16px; opacity: 0.9; }
        
        .brand-item { display: none; }
        .brand-item.active { display: block; }
        .brand-header { background: #fff; padding: 15px 20px; border-radius: 10px; display: flex; align-items: center; cursor: pointer; border: 1px solid #eee; margin-bottom: 10px; }
        .brand-header h3 { margin: 0; font-size: 18px; flex-grow: 1; color: var(--primary); }
        .brand-body { display: none; padding: 20px 0; }
        .brand-body.open { display: block; }
